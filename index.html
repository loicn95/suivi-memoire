<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0D1117;-webkit-font-smoothing:antialiased}
input,textarea,button,select{font-family:inherit}
button{transition:filter .15s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){filter:brightness(.94)}
a{transition:filter .15s}
a:hover{filter:brightness(1.12)}
button:focus-visible,a:focus-visible{outline:2px solid #58A6FF;outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:#58A6FF!important}
*{scrollbar-width:thin;scrollbar-color:#3a424d transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a424d;border-radius:99px}
.tabs-scroll{scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab-btn{white-space:nowrap}
.clickable{transition:border-color .15s,transform .15s}
.clickable:hover{border-color:#58A6FF!important}
/* Espace directeur : barre latérale et contenu défilent séparément sur grand écran */
.dir-root{height:100vh;height:100dvh}
.print-only{display:none}
@media print{
  @page{margin:16mm}
  html,body{background:#fff!important}
  .dir-root{height:auto!important;min-height:0!important;display:block!important;background:#fff!important}
  .dir-root>*:not(.print-only){display:none!important}
  body[data-print="fiche"] .print-fiche,body:not([data-print]) .print-fiche,
  body[data-print="nr"] .print-nr,body[data-print="ecrit"] .print-ecrit,body[data-print="oral"] .print-oral{display:block!important}
}
/* Mobile et petites tablettes */
@media(max-width:760px){
  .dir-root{height:auto!important;min-height:100dvh}
  .dir-layout{flex-direction:column!important}
  .dir-sidebar{width:auto!important;min-width:0!important;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden!important;border-right:none!important;border-bottom:1px solid #30363D;padding:10px 12px!important;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .dir-sidebar::-webkit-scrollbar{display:none}
  .esi-card{flex:0 0 200px;margin-bottom:0!important}
  .dir-main{overflow:visible!important}
  .dir-head{padding:12px 14px 0!important}
  .dir-content,.page-pad{padding:16px 14px!important;overflow:visible!important}
  .app-header{padding:10px 14px!important;gap:8px!important}
  .app-header>:nth-child(2){order:-1;flex:1 1 100%!important}
  .tabs-scroll{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-btn{flex-shrink:0}
  .card-grid{grid-template-columns:1fr!important}
  .kanban{grid-template-columns:repeat(4,78vw)!important;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  input,textarea,select{font-size:16px!important}
  .hide-mobile{display:none!important}
}
</style>

var fbApp=null,fbDb=null;
function initFB(){
  try{
    if(!fbApp){fbApp=firebase.initializeApp(FB_CONFIG);fbDb=firebase.database();}
    return fbDb;
  }catch(e){return null;}
}
function fbRef(path){var db=initFB();return db?db.ref(path):null;}
function fbLire(path,cb){var r=fbRef(path);if(r)r.on("value",function(snap){cb(snap.val()||{});});}
function fbLireUne(path,cb,timeout){
  var r=fbRef(path);
  if(!r){cb({});return;}
  var done=false;
  var timer=setTimeout(function(){
    if(!done){done=true;cb({});}
  },timeout||5000);
  r.once("value",function(snap){
    if(!done){done=true;clearTimeout(timer);cb(snap.val()||{});}
  },function(){
    if(!done){done=true;clearTimeout(timer);cb({});}
  });
}
function fbEcrire(path,data){var r=fbRef(path);if(r)r.set(data);}
function fbPush(path,data){var r=fbRef(path);if(r)r.push(data);}
function fbSuppr(path){var r=fbRef(path);if(r)r.remove();}
function fbUpdate(path,data){var r=fbRef(path);if(r)r.update(data);}

function BtnSuppr(props){
  var _s=useState(false),armed=_s[0],setArmed=_s[1];
  useEffect(function(){
    if(!armed)return;
    var t=setTimeout(function(){setArmed(false);},3000);
    return function(){clearTimeout(t);};
  },[armed]);
  var c=props.c||C;
  if(armed)return h("button",{onClick:function(ev){ev.stopPropagation();setArmed(false);props.onConfirm();},title:"Cliquer à nouveau pour confirmer",style:bs(c.red,"#fff",props.full?{width:"100%",marginTop:8}:{fontSize:11,padding:"5px 10px",whiteSpace:"nowrap"})},"Confirmer la suppression ?");
